# Optional local PostgreSQL 18 for development (the same engine as Neon in production; localhost only).
# docker compose up -d   →   postgresql://postgres:postgres@localhost:5432/stjohns?sslmode=disable
# A Neon dev branch works just as well and needs no Docker (see README › Local development).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stjohns
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
